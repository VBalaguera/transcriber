[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "transcriber"
dynamic = ["version"]
description = "Convierte exportaciones Atom de Blogger / Google Takeout a JSON, CSV y PDF."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "VBalaguera" }]
keywords = ["blogger", "google-takeout", "atom", "pdf", "csv", "json"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: Spanish",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing :: Markup :: HTML",
    "Topic :: Utilities",
]
dependencies = [
    "beautifulsoup4>=4.11",
    "feedparser>=6.0",
    "fpdf2>=2.7",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "pypdf>=4.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
transcriber = "transcriber.cli:main"

[project.urls]
Repository = "https://github.com/VBalaguera/transcriber"

[tool.hatch.version]
path = "src/transcriber/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/transcriber"]

# --- Ruff ---------------------------------------------------------------------

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "W",    # pycodestyle (avisos)
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "PTH",  # flake8-use-pathlib
    "RET",  # flake8-return
    "PT",   # flake8-pytest-style
    "ERA",  # código comentado
    "RUF",  # reglas propias de Ruff
]

[tool.ruff.format]
quote-style = "single"

# --- Mypy ---------------------------------------------------------------------

[tool.mypy]
# Los tests no se versionan (ver .gitignore); en local: `mypy src tests`.
files = ["src"]
python_version = "3.10"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
# feedparser no publica anotaciones de tipos.
module = ["feedparser", "feedparser.*"]
ignore_missing_imports = true

# --- Pytest y cobertura -------------------------------------------------------

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
source = ["transcriber"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 95
exclude_also = ["if __name__ == .__main__.:"]
